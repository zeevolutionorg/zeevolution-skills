# How to use tab
how_title: "📖 How to use this sheet"
how_what: "What it is: a pillar-by-pillar view of where the person stands against the current level and the next one. It's filled together by the person and the leader, every half or every cycle."
how_flow_title: "The 4-step flow"
how_flow_1: "1. Assessment tab: confirm the header (person, levels, cycle). The expectations fill in automatically."
how_flow_2: "2. The person picks a Self score for each pillar; the leader picks a Leader score. Paste evidence links."
how_flow_3: "3. Talk about every row flagged ⚑ (scores two or more steps apart) in the next bi-weekly."
how_flow_4: "4. Summary tab: read the chart and readiness, write the conclusion and actions. At the end of the cycle, copy the results into History."
