how_scale_2: "At level — does what the current level expects, reliably."
how_scale_3: "Strong at level — consistently does it well, with little help; a reference for others."
how_scale_4: "Operating at next level — already shows what the next level expects, with evidence."
how_scale_na: "N/A — not applicable this period."
