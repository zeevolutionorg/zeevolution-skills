note_well: "One or two sentences. Example: 'Breaks ambiguous asks into a plan the team can follow.'"
note_improve: "One or two sentences, specific. Example: 'Risks are listed but rarely get an owner and a date.'"
note_signal: "✅ when the leader scored 'Operating at next level'."

