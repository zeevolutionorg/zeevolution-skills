# How to use tab
how_title: "📖 Como usar esta planilha"
how_what: "O que é: uma visão, pilar por pilar, de onde a pessoa está em relação ao nível atual e ao próximo. É preenchida em conjunto pela pessoa e pelo líder, a cada semestre ou a cada ciclo."
how_flow_title: "O fluxo em 4 passos"
how_flow_1: "1. Aba Avaliação: confirme o cabeçalho (pessoa, níveis, ciclo). As expectativas são preenchidas automaticamente."
how_flow_2: "2. A pessoa escolhe uma Nota própria para cada pilar; o líder escolhe uma Nota do líder. Colem os links de evidências."
how_flow_3: "3. Conversem sobre cada linha marcada com ⚑ (notas a dois ou mais degraus de distância) no próximo 1:1 quinzenal."
how_flow_4: "4. Aba Resumo: leiam o gráfico e a prontidão, escrevam a conclusão e as ações. No fim do ciclo, copiem os resultados para o Histórico."
how_scale_title: "A escala (sempre em relação ao nível ATUAL)"
how_scale_1: "Ainda não no nível — ainda está construindo o que o nível atual espera."
how_scale_2: "No nível — faz o que o nível atual espera, de forma consistente."
how_scale_3: "Forte no nível — faz bem, com consistência e pouca ajuda; é referência para outras pessoas."
how_scale_4: "Atuando no próximo nível — já mostra o que o próximo nível espera, com evidências."
how_scale_na: "N/A — não se aplica neste período."
how_colors_title: "Cores"
how_color_input: "Células amarelas: preencha estas."
how_color_computed: "Células cinza: calculadas ou somente leitura. Não edite."
how_ladder_title: "Trilha de carreira"
how_ladder_text: "A aba Trilha guarda as expectativas por nível e pilar. Se estiver escrito Trilha genérica, troque pela trilha da sua empresa quando tiver uma, mantendo o mesmo formato."
how_hub: "Esta planilha faz parte do Hub de Carreira da pessoa. Revisem em um 1:1 quinzenal pelo menos uma vez por semestre."
