# Hover notes
note_pillar: "Vem da aba Trilha. Altere os pilares lá, não aqui."
note_expect: "Preenchido automaticamente a partir da aba Trilha para o nível escolhido acima. Somente leitura."
note_self: "Nota da própria pessoa, em relação ao nível ATUAL. Exemplo: 'Forte no nível' quando você faz com consistência o que o nível espera, com pouca ajuda."
note_leader: "Nota do líder, em relação ao nível ATUAL. 'Atuando no próximo nível' só com evidência linkada."
note_gap: "Nota do líder menos a nota própria, em degraus. Diferença de 2 ou mais degraus significa que vocês enxergam de forma diferente: conversem sobre isso."
note_evidence: "Cole um link (começando com http). Exemplo: o registro no Brag, um pull request, uma análise, um arquivo de design, uma especificação."
note_well: "Uma ou duas frases. Exemplo: 'Quebra pedidos ambíguos em um plano que o time consegue seguir.'"
note_improve: "Uma ou duas frases, específicas. Exemplo: 'Os riscos são listados, mas raramente ganham responsável e data.'"
note_signal: "✅ quando o líder deu a nota 'Atuando no próximo nível'."

