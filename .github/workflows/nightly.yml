# Nightly — the slow or paid checks that don't need to block every PR.
name: nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: External links still work (README, docs, skills)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path skills/career-management/career-hub-toolkit/assets "./**/*.md"
          fail: true

  evals-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: npm install -g @anthropic-ai/claude-code
      - name: Behavioral evals (full suite)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --no-publish --runs 3 \
            --threshold 0.8 --max-cost-usd 20 --json eval-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-nightly
          path: |
            eval-results.json
            evals/results/
