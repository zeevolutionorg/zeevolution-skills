# Nightly — link checks that don't need to block every pull request.
name: nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: External links still work (README, docs, skills)
        uses: lycheeverse/lychee-action@v2
        with:
          # Excludes and placeholder patterns live in lychee.toml.
          args: --config lychee.toml "./**/*.md"
          fail: true
