name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Skill assets in sync
        run: python scripts/sync_skill_assets.py --check
      - name: Validate skills and manifests
        run: python scripts/validate_skills.py
      - name: Language parity
        run: python scripts/check_parity.py
      - name: Dry run (4 personas x 2 modes x 2 languages)
        run: python scripts/dry_run.py
      - name: Build release assets
        run: python scripts/build.py
      - name: Leak check (repo + built files)
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$LEAK_DENYLIST" ]; then echo "::error::LEAK_DENYLIST secret is not set"; exit 1; fi
          python scripts/check_leaks.py
