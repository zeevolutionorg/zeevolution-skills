# CI — runs on every pull request and on main.
# Stages run in order; each one only starts if the previous passed, so failures show up cheapest-first.
#
#   1. lint         ruff, ruff format, yamllint, markdownlint, actionlint           (~30 s)
#   2. consistency  bundled copies in sync, skills/manifests valid, EN/pt-BR parity   (~10 s)
#   3. tests        unit + contract tests, coverage gate (Linux, macOS, Windows)      (~1 min)
#   4. e2e          dry run (32 hubs: files + manual) and release build               (~1 min)
#   5. sheets       spreadsheet formulas recalculated by LibreOffice (EN + pt-BR)     (~2 min)
#   6. security     leak check on repo + built files, gitleaks secret scan            (~30 s)
#   7. evals        behavioral evals with `claude plugin eval` (opt-in, label run-evals)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # reused by release.yml as the release gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format)
        run: ruff format --check .
      - name: yamllint
        run: yamllint -c .yamllint.yml .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            *.md
            docs/**/*.md
            skills/**/*.md
            templates/*.md
            evals/*.md
            !skills/**/assets/**
      - name: actionlint
        uses: raven-actions/actionlint@v2

  consistency:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - name: Bundled copies in sync with the sources
        run: python scripts/sync_skill_assets.py --check
      - name: Skills and plugin manifests valid
        run: python scripts/validate_skills.py
      - name: English / Portuguese parity
        run: python scripts/check_parity.py

  tests:
    needs: consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12", coverage: true}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit + contract tests
        if: ${{ !matrix.coverage }}
        run: python -m pytest -m "unit or contract"
      - name: Unit + contract tests with coverage gate
        if: ${{ matrix.coverage }}
        run: python -m pytest -m "unit or contract or e2e" --cov --cov-report=xml --cov-report=term
      - if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with: {name: coverage, path: coverage.xml}

  e2e:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - name: End-to-end tests (dry run + build)
        run: python -m pytest -m e2e
      - name: Dry run report (32 hubs, files + manual)
        run: python scripts/dry_run.py --out "${{ runner.temp }}/dry-run"
      - name: Build release assets
        run: python scripts/build.py --out dist
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/, retention-days: 7}

  sheets:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - name: LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Spreadsheet formulas recalculate correctly
        run: python -m pytest -m libreoffice

  security:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt pillow
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist}
      - name: Leak check (repo + built files)
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$LEAK_DENYLIST" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "::warning::Fork PR: denylist secret unavailable; running URL/email/metadata checks only"
            else
              echo "::error::LEAK_DENYLIST secret is not set"; exit 1
            fi
          fi
          python scripts/check_leaks.py . dist
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    needs: [e2e, sheets, security]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Behavioral evals (smoke)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --no-publish --tag smoke --runs 1 \
            --threshold 0.75 --max-cost-usd 5 --json eval-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals
          path: |
            eval-results.json
            evals/results/
