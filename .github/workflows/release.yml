# Release — on a v* tag: run the whole CI gate again, then build and publish.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pillow
      - name: LibreOffice (for START-HERE.pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Version in manifests matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          python - "$v" <<'PY'
          import json, sys
          for f in (".claude-plugin/plugin.json", ".cursor-plugin/plugin.json"):
              got = json.load(open(f))["version"]
              assert got == sys.argv[1], f"{f}: version {got} != tag {sys.argv[1]}"
          PY
      - run: python scripts/build.py --out dist
      - name: Leak check (built files)
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$LEAK_DENYLIST" ]; then echo "::error::LEAK_DENYLIST secret is not set"; exit 1; fi
          python scripts/check_leaks.py . dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            dist/career-management-kit-en.zip dist/career-management-kit-pt-BR.zip \
            dist/zeevolution-skills-all-skills.zip dist/skills/*.skill
