name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: LibreOffice (for START-HERE.pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: python scripts/sync_skill_assets.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/check_parity.py
      - run: python scripts/build.py
      - name: Leak check (repo + built files)
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$LEAK_DENYLIST" ]; then echo "::error::LEAK_DENYLIST secret is not set"; exit 1; fi
          python scripts/check_leaks.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            dist/career-management-kit-en.zip dist/career-management-kit-pt-BR.zip \
            dist/zeevolution-skills-all-skills.zip dist/skills/*.skill
