extends: default
rules:
  line-length: disable
  document-start: disable
  truthy: {check-keys: false}
  braces: {max-spaces-inside: 1}
  brackets: {max-spaces-inside: 1}
  comments: {min-spaces-from-content: 1}
  colons: {max-spaces-after: -1}
  indentation: {spaces: 2, indent-sequences: consistent}
ignore: |
  skills/career-management/career-hub-toolkit/assets/
  skills/career-management/career-ladder/assets/
