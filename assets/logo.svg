<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">zeevolution-skills</title>
  <desc id="d">A Z drawn as a rising staircase between code brackets: engineering craft and career growth, step by step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="z" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- code brackets -->
  <polyline points="27,46 15,64 27,82" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <polyline points="101,46 113,64 101,82" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- the Z: top bar, a staircase for the diagonal, bottom bar -->
  <path d="M38 34 H86 V46 H74 V58 H62 V70 H50 V82 H42 V94 H90"
        fill="none" stroke="url(#z)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- growth spark at the top of the climb -->
  <path d="M99 18 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z" fill="#A3E635"/>
</svg>
